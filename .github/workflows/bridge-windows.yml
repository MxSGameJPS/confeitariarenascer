name: Build Renascer Bridge Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "bridge-v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Check syntax
        run: npm run check
      - name: Build installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Renascer-Bridge-Windows
          path: desktop/bridge/dist/*.exe
          if-no-files-found: error
